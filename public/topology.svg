<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Illustrative infrastructure topology</title><desc id="desc">A virtualization host connects services, automation, observation and a GPU lab. Services connect to an alert relay, which also connects to observation.</desc><g fill="none" stroke="#4c7191" stroke-width="2"><path d="M120 90H360M120 90V220M120 90L360 220M120 90L600 220M360 90H600M600 90V220"/></g><g fill="#e5edf0" stroke="#7895a5"><rect x="40" y="60" width="160" height="60" rx="8"/><rect x="280" y="60" width="160" height="60" rx="8"/><rect x="520" y="60" width="160" height="60" rx="8"/><rect x="40" y="190" width="160" height="60" rx="8"/><rect x="280" y="190" width="160" height="60" rx="8"/><rect x="520" y="190" width="160" height="60" rx="8"/></g><g fill="#152129" font-family="sans-serif" font-size="16" text-anchor="middle"><text x="120" y="96">Virtualization</text><text x="360" y="96">Services</text><text x="600" y="96">Alert relay</text><text x="120" y="226">GPU lab</text><text x="360" y="226">Automation</text><text x="600" y="226">Observability</text></g></svg>
