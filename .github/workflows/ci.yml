name: Archive checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified release commit

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, verified release commit
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate archive README
        run: |
          npm run content:check
          npm run content:build
          git diff --exit-code -- README.md

      - name: Run documentation tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=low
