name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified release commit

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, verified release commit
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate content
        run: |
          npm run content:check
          npm run content:build
          git diff --exit-code -- README.md

      - name: Run model and content tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build static site
        run: npm run build

      - name: Audit authored and generated public artifacts
        run: npm run audit:public

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run preview browser tests
        run: npm run test:e2e
